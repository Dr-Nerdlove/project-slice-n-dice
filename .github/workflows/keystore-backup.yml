# One-off: packs the release signing key into an AES-256 encrypted 7-Zip
# archive so the owner can keep a copy outside GitHub. To be removed again
# right after it has been used once (together with the secret
# KEYSTORE_BACKUP_PASSWORD).
#
# Nothing secret is written to the log: no `set -x`, no echo of values, the
# files live in $RUNNER_TEMP and are shredded at the end. The archive is
# encrypted including its file names (-mhe=on); in this public repository any
# logged-in GitHub user can download the artifact until it expires or is
# deleted, so its protection is the archive password alone.
name: Keystore backup (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keystore-backup
  cancel-in-progress: true

jobs:
  backup:
    # Only the repository owner may start it.
    if: github.actor == 'Dr-Nerdlove'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pack keystore into an encrypted archive
        env:
          TEST_KEYSTORE_B64: ${{ secrets.TEST_KEYSTORE_B64 }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          ARCHIVE_PASSWORD: ${{ secrets.KEYSTORE_BACKUP_PASSWORD }}
        run: |
          set -eu
          set +x
          if [ -z "$TEST_KEYSTORE_B64" ] || [ -z "$TEST_KEYSTORE_PASSWORD" ]; then
            echo "The secrets TEST_KEYSTORE_B64 and TEST_KEYSTORE_PASSWORD are missing" >&2
            exit 1
          fi
          if [ "${#ARCHIVE_PASSWORD}" -lt 20 ]; then
            echo "The secret KEYSTORE_BACKUP_PASSWORD is missing or shorter than 20 characters" >&2
            exit 1
          fi
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get install -y -qq p7zip-full >/dev/null
          fi
          work="$RUNNER_TEMP/kb"
          mkdir -p "$work/in" "$RUNNER_TEMP/out"
          umask 077
          printf '%s' "$TEST_KEYSTORE_B64" | base64 -d > "$work/in/slicendice-test.keystore"
          {
            printf 'Spinback Rumble release signing key\n'
            printf 'Keystore file: slicendice-test.keystore\n'
            printf 'Key alias: slicendice-test\n'
            printf 'Keystore password (also the key password): %s\n' "$TEST_KEYSTORE_PASSWORD"
            printf '\nGitHub secrets: TEST_KEYSTORE_B64 = the keystore file in base64,\n'
            printf 'TEST_KEYSTORE_PASSWORD = the password above.\n'
          } > "$work/in/README.txt"
          # -mhe=on also encrypts the file names; -bso0 -bsp0 keep 7z quiet.
          (cd "$work/in" && 7z a -t7z -mhe=on -mx=9 -bso0 -bsp0 \
            -p"$ARCHIVE_PASSWORD" "$RUNNER_TEMP/out/keystore-backup.7z" \
            slicendice-test.keystore README.txt)
          # Check that the archive opens with the password, without listing it.
          7z t -bso0 -bsp0 -p"$ARCHIVE_PASSWORD" "$RUNNER_TEMP/out/keystore-backup.7z"
          shred -u "$work/in/slicendice-test.keystore" "$work/in/README.txt"
          echo "Encrypted archive created and tested."

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: ${{ runner.temp }}/out/keystore-backup.7z
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
