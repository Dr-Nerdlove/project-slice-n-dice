name: Secret scan

# Scans the whole git history of every push and pull request for secrets, on every branch and for every change
# (documentation too: a key can end up in a text file as well). Kept apart from ci.yml because ci.yml skips
# documentation-only changes.
# The gitleaks binary is downloaded from the official release and checked against the release's checksums
# (not the gitleaks GitHub Action: it needs a licence key for some accounts and runs third-party code with
# the token). --redact keeps a found secret out of the log.
on:
  push:
  pull_request:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -eu
          mkdir -p ~/gitleaks-dl ~/gitleaks-bin
          cd ~/gitleaks-dl
          rel=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          tgz=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSL -O "$rel/$tgz"
          curl -fsSL -O "$rel/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tgz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$tgz" -C ~/gitleaks-bin gitleaks

      - name: Scan the history for secrets
        run: ~/gitleaks-bin/gitleaks git --redact --no-banner --no-color --verbose .
