name: CI

# Runs on pull requests and after a merge to main. Changes that only touch documentation, the README or the AI
# instructions are skipped (see "GitHub Actions" in AGENTS.md). The secret scan has its own workflow
# (secrets.yml) and runs on every push, documentation included. No APK is built here: APKs are built only by the
# release workflow and attached to the GitHub Release, so CI keeps nothing it builds.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-editor-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot editor
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p ~/godot-bin ~/godot-dl
          cd ~/godot-dl
          zip=Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          curl -fsSL -O "$GODOT_RELEASE/$zip"
          curl -fsSL -O "$GODOT_RELEASE/SHA512-SUMS.txt"
          grep " $zip\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: tests/run.sh
